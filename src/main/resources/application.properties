spring.application.name=ss8_library
# ===============================
# 1. C?u hình k?t n?i PostgreSQL
# ===============================
# Thay "ss8_library_db" b?ng tên database b?n ?ã t?o trong PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ss8_library_db
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver
# ===============================
# 2. C?u hình Hibernate / JPA
# ===============================
# update: T? ??ng t?o ho?c c?p nh?t b?ng 'books' trong DB kh?p v?i Entity Book
spring.jpa.hibernate.ddl-auto=update
# Hi?n th? câu l?nh SQL trong console ?? d? debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ===============================
# 3. C?u hình Upload File (?ã th?o lu?n ? các b??c tr??c)
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB